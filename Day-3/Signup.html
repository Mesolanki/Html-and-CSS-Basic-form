<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Resido</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Signup.css">
    <link rel="stylesheet" href="Navbar.css">
    <link rel="stylesheet" href="Footer.css">
    <link rel="icon" href="https://resido-shreethemes.vercel.app/static/media/logo.1d96876acb9e2ccab8dd63a9a1670cde.svg">
</head>
<body>
   <div id="header"></div>
    
    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-form-wrapper">
                <div class="auth-form-container">
                    <div class="logo-container">
                        <img src="https://resido-shreethemes.vercel.app/static/media/logo.1d96876acb9e2ccab8dd63a9a1670cde.svg" alt="Resido Logo" class="auth-logo">
                    </div>
                    
                    <h3>Create an Account</h3>
                    <p class="auth-subtitle">Join Resido to find your perfect home.</p>

                    <form id="signup-form">
                        <div class="form-group">
                            <label for="fullname">Full Name</label>
                            <div class="input-with-icon">
                                <i class="fa-regular fa-user"></i>
                                <input type="text" id="fullname" placeholder="John Doe" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <div class="input-with-icon">
                                <i class="fa-regular fa-envelope"></i>
                                <input type="email" id="email" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" id="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn-auth-submit">Create Account</button>
                    </form>

                    <div class="form-footer">
                        <p>Already have an account? <a href="Login.html">Sign In here</a></p>
                    </div>
                </div>
            </div>
            <div class="auth-image">
                <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" alt="Family Home">
                <div class="auth-image-overlay">
                    <h2>Join Our Community</h2>
                    <p>Get access to exclusive listings, save your favorites, and get notified about price drops.</p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>
    <script src="serarch.js"></script>


</body>
</html>
