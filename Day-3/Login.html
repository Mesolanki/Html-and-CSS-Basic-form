<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Signin in Resido</title>
    <link rel="stylesheet" href="Login.css">
    <link rel="icon"
        href="https://resido-shreethemes.vercel.app/static/media/logo.1d96876acb9e2ccab8dd63a9a1670cde.svg">
    </link>
</head>

<body>
    <div id="navbar-container">

    </div>
    <div class="container">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo">
                    <img src="logo.png" alt="logo.png">
                </div>
                <div class="logo-data">
                    <h3>Login to Your Account</h3>
                </div>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="*******" required>
                </div>

                <div class="form-options">
                    <label><input type="checkbox"> Remember Me</label>
                    <a href="#" class="forgot-pass">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>

            <div class="form-footer">
                <p>Don't have an account? <a href="Signup.html">Sign Up</a></p>
            </div>
        </div>
    </div>
    <div id="Footer-Container">

    </div>
    <script>
        fetch('Navbar.html')
            .then(response => {
                return response.text();
            })
            .then(htmlContent => {
                document.getElementById('navbar-container').innerHTML = htmlContent;
            })
        fetch('Footer.html')
            .then(response => {
                return response.text();
            })
            .then(htmlContent => {
                document.getElementById('Footer-Container').innerHTML = htmlContent;
            })
    </script>
</body>

</html>
