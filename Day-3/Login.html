<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Resido</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Login.css">
    <link rel="stylesheet" href="Navbar.css">
    <link rel="stylesheet" href="Footer.css">
    <link rel="icon" href="https://resido-shreethemes.vercel.app/static/media/logo.1d96876acb9e2ccab8dd63a9a1670cde.svg">
</head>
<body>
    <div id="header"></div>
   
    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-image">
                <img src="https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=800&q=80" alt="Modern House">
                <div class="auth-image-overlay">
                    <h2>Welcome Back</h2>
                    <p>Log in to access your saved properties, manage your listings, and connect with agents.</p>
                </div>
            </div>
            <div class="auth-form-wrapper">
                <div class="auth-form-container">
                    <div class="logo-container">
                        <img src="https://resido-shreethemes.vercel.app/static/media/logo.1d96876acb9e2ccab8dd63a9a1670cde.svg" alt="Resido Logo" class="auth-logo">
                    </div>
                    
                    <h3>Sign In to Resido</h3>
                    <p class="auth-subtitle">Enter your credentials to proceed.</p>

                    <form id="login-form">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <div class="input-with-icon">
                                <i class="fa-regular fa-envelope"></i>
                                <input type="email" id="email" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" id="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox"> 
                                <span class="checkmark"></span>
                                Remember Me
                            </label>
                            <a href="#" class="forgot-pass">Forgot Password?</a>
                        </div>

                        <button type="submit" class="btn-auth-submit">Sign In</button>
                    </form>

                    <div class="form-footer">
                        <p>Don't have an account? <a href="Signup.html">Sign Up here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
<div id="footer"></div>
    <script src="./serarch.js"></script>

</body>
</html>
